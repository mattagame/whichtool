name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The suite runs on Bun, which is the dev toolchain.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # And the built CLI has to work on Node, which is where the MCP ecosystem lives.
  # A package that only runs on the toolchain that built it is not distributed.
  node:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      # Exercise the paths that need no key: they are the ones every user hits first.
      # The pair fixture plants byte-identical descriptions on purpose, so the documented
      # contract is exit 1: a valid inspection with an error finding. Exit 0 there would
      # be the false green, and exit 2 would mean the inspection itself broke.
      - name: inspect
        shell: bash
        run: |
          node ./dist/cli/main.js inspect ./tests/fixtures/servers/clean.json
          status=0
          node ./dist/cli/main.js inspect ./tests/fixtures/servers/list-search-pair.json || status=$?
          test "$status" -eq 1
      - name: tasks lint
        run: node ./dist/cli/main.js tasks lint ./tests/fixtures/servers/list-search-pair.json --tasks ./tests/fixtures/tasks/list-search.tasks.yaml
      - name: dry run
        run: node ./dist/cli/main.js run ./tests/fixtures/servers/list-search-pair.json --tasks ./tests/fixtures/tasks/list-search.tasks.yaml --dry-run
      - name: run, report and diff with the deterministic provider
        shell: bash
        run: |
          node ./dist/cli/main.js run ./tests/fixtures/servers/list-search-pair.json \
            --tasks ./tests/fixtures/tasks/list-search.tasks.yaml \
            --provider mock --repeat 2 --format json --out run.json
          node ./dist/cli/main.js report run.json --format markdown > /dev/null
          node ./dist/cli/main.js report run.json --format html --out report.html
          node ./dist/cli/main.js diff run.json run.json
          node ./dist/cli/main.js cache info

  # A published package that fails to install is a worse failure than a failing test,
  # because it fails for the user rather than for us.
  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack
      - name: Install the tarball into a clean directory and run it
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y
          npm install "$GITHUB_WORKSPACE"/whichtool-*.tgz
          npx whichtool --version
          npx whichtool inspect "$GITHUB_WORKSPACE/tests/fixtures/servers/clean.json"

  # Build the same image users pull from GHCR and exercise its entrypoint.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build --tag whichtool:test .
      - name: Smoke-test image
        run: |
          docker run --rm whichtool:test --version
          docker run --rm whichtool:test --help
