name: release

# PUBLICATION IS PAUSED.
# This workflow is intentionally kept as a hardened template for a possible future release.
# A manual run skips every job, and tag pushes do not trigger it. To re-enable publishing,
# review the whole template, restore the intended trigger, and remove every `if: ${{ false }}`
# guard deliberately rather than changing only one line.
on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag $tag does not match package version $pkg" >&2; exit 1; }
      - name: The tag commit must belong to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "refusing to release a tag whose commit is not on main" >&2
            exit 1
          }

  # Standalone executables remain buildable locally, but are deliberately not published
  # until the notices and redistribution obligations of Bun's embedded runtime have been
  # reviewed and can ship beside every binary.

  quality:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - run: bun run build
      - run: npm pack --dry-run

  npm:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: quality
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The first version may be bootstrapped locally because npm only allows a trusted
      # publisher to be attached after the package exists. Keeping this job idempotent
      # lets the matching tag still create the container image and GitHub release.
      - name: Check whether this version is already published
        id: npm_version
        shell: bash
        run: |
          package="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          expected_git_head="$(git rev-parse HEAD)"
          set +e
          published_git_head="$(npm view "$package@$version" gitHead 2>&1)"
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ]; then
            if [ "$published_git_head" != "$expected_git_head" ]; then
              echo "$package@$version already exists but was not published from $expected_git_head" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package@$version is already published; skipping npm publish."
          elif [[ "$published_git_head" == *"E404"* ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$published_git_head" >&2
            exit "$view_status"
          fi
      - name: Publish to npm with trusted publishing
        if: steps.npm_version.outputs.published != 'true'
        run: npm publish --ignore-scripts --access public

  container:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An OCI reference must be all lowercase, and `github.repository` keeps the owner's
      # stored casing. Interpolating it straight into `tags:` fails the push on a name
      # from an unrelated repository before the build is even attempted.
      - name: Lowercase the image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.image }}:${{ github.ref_name }}
            ${{ env.image }}:latest

  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: container
    environment: release
    permissions:
      contents: write
    steps:
      # Publish only GitHub's source archives. Binary assets stay disabled until their
      # third-party notices are complete.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
